<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0a">
  <title>10 «А» · Альбом 2024 — 2025</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-light"></div>
    <div class="ambient-vignette"></div>
    <div class="ambient-grain"></div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-mark">10A</span>
      <span class="brand-divider"></span>
      <span class="brand-text">School Yearbook</span>
    </div>
    <div class="topbar-right">
      <span class="brand-year">MMXXIV — MMXXV</span>
    </div>
  </header>

  <main class="scene">
    <div class="table-shadow" aria-hidden="true"></div>

    <div class="book-stage">
      <div id="album" class="book" aria-label="Школьный альбом, листайте страницы"></div>
    </div>
  </main>

  <nav class="controls" aria-label="Управление альбомом">
    <button id="prev" class="ctrl-btn" aria-label="Предыдущая страница">
      <span class="ctrl-arrow" aria-hidden="true">←</span>
      <span class="ctrl-label">Назад</span>
    </button>

    <div class="page-meter">
      <span id="page-current">01</span>
      <span class="page-meter-sep">/</span>
      <span id="page-total">—</span>
    </div>

    <button id="next" class="ctrl-btn" aria-label="Следующая страница">
      <span class="ctrl-label">Вперёд</span>
      <span class="ctrl-arrow" aria-hidden="true">→</span>
    </button>
  </nav>

  <p class="hint">потяни за уголок · стрелки ← → · свайп на мобильном</p>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="js/album.js"></script>
</body>
</html>
